        <script src="https://cdn.jsdelivr.net/npm/darkreader@4.9.80/darkreader.min.js"></script>
        <script>
            const drOptions = {
                brightness: 100,
                contrast: 95,
                sepia: 10,
                darkSchemeTextColor: '#e0e0e0',  // 粉笔白文字
                darkSchemeBackgroundColor: '#1e1e1e', // 黑板灰背景
                scrollbarStyle: 'native'
            };

            const savedTheme = localStorage.getItem('theme');
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
                DarkReader.enable(drOptions);
            }

            window.addEventListener('DOMContentLoaded', () => {
                const btn = document.createElement('button');
                btn.innerText = '🌓';
                // 按钮样式：仿照你之前的布局，放在右下角
                btn.style.cssText = `
                    position: fixed; 
                    bottom: 40px; 
                    left: 42px; 
                    z-index: 9999;
                    width: 44px; 
                    height: 44px; 
                    border-radius: 50%; 
                    border: 1px solid #ccc;
                    background: #f7f5ed; 
                    color: #000;
                    font-size: 22px; 
                    cursor: pointer;
                    box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
                    transition: transform 0.2s, background-color 0.3s;
                `;
                // 根据当前状态初始化按钮颜色
                if (DarkReader.isEnabled()) {
                    btn.style.backgroundColor = '#1e1e1e';
                    btn.style.color = '#fff';
                }
                btn.onmouseover = () => btn.style.transform = 'scale(1.1)';
                btn.onmouseout = () => btn.style.transform = 'scale(1)';
                document.body.appendChild(btn);
                // 点击切换逻辑
                btn.addEventListener('click', () => {
                    if (DarkReader.isEnabled()) {
                        DarkReader.disable();
                        localStorage.setItem('theme', 'light');
                        btn.style.backgroundColor = '#f7f5ed';
                        btn.style.color = '#000';
                    } else {
                        DarkReader.enable(drOptions);
                        localStorage.setItem('theme', 'dark');
                        btn.style.backgroundColor = '#1e1e1e';
                        btn.style.color = '#fff';
                    }
                });
            });
        </script>

  <div class="lyrics-box" id="lyricsBox"></div>

  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <span class="time" id="timeDisplay">0:00 / 0:00</span>
  </div>

  <div class="controls">
    <button id="prevBtn">⏮</button>
    <button class="primary" id="playBtn"><span id="playIcon">⏸</span></button>
    <button id="nextBtn">⏭</button>
    <button id="resetBtn">⟳ 重播</button>
  </div>

  <script>
    (function() {
      // ---------- 歌词 ----------
      const LYRICS = [
        '故事的小黄花 从出生那年就飘着',
        '童年的荡秋千 随记忆一直晃到现在',
        'Re So So Si Do Si La',
        'So La Si Si Si Si La Si La So',
        '吹着前奏望着天空 我想起花瓣试着掉落',
        '为你翘课的那一天 花落的那一天',
        '教室的那一间 我怎么看不见',
        '消失的下雨天 我好想再淋一遍',
        '没想到失去的勇气我还留着',
        '好想再问一遍 你会等待还是离开',
        '刮风这天我试过握着你手',
        '但偏偏雨渐渐大到我看你不见',
        '还要多久我才能在你身边',
        '等到放晴的那天也许我会比较好一点',
        '从前从前有个人爱你很久',
        '但偏偏风渐渐把距离吹得好远',
        '好不容易又能再多爱一天',
        '但故事的最后你好像还是说了拜拜'
      ];

      // ---------- DOM ----------
      const box = document.getElementById('lyricsBox');
      const fill = document.getElementById('progressFill');
      const timeDisplay = document.getElementById('timeDisplay');
      const playBtn = document.getElementById('playBtn');
      const playIcon = document.getElementById('playIcon');
      const prevBtn = document.getElementById('prevBtn');
      const nextBtn = document.getElementById('nextBtn');
      const resetBtn = document.getElementById('resetBtn');
      const progressBar = document.getElementById('progressBar');

      let current = 0;
      let isPlaying = true;
      let timer = null;
      const STEP = 3200; // 每句毫秒

      // ---------- 渲染 ----------
      function render() {
        box.innerHTML = '';
        LYRICS.forEach((text, i) => {
          const div = document.createElement('div');
          div.className = 'line';
          if (i === current) div.classList.add('active');
          else if (i < current) div.classList.add('done');
          else div.classList.add('upcoming');
          div.textContent = text;
          box.appendChild(div);
        });
        scrollToActive();
        updateProgress();
      }

      function scrollToActive() {
        const active = box.querySelector('.active');
        if (active) {
          const top = active.offsetTop - box.clientHeight/2 + active.offsetHeight/2;
          box.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
        }
      }

      function updateProgress() {
        const total = LYRICS.length;
        const pct = total > 1 ? (current / (total - 1)) * 100 : 0;
        fill.style.width = Math.min(pct, 100) + '%';
        // 时间
        const totalSec = (total - 1) * (STEP / 1000);
        const curSec = current * (STEP / 1000);
        timeDisplay.textContent = formatTime(curSec) + ' / ' + formatTime(totalSec);
      }

      function formatTime(sec) {
        const m = Math.floor(sec / 60);
        const s = Math.floor(sec % 60);
        return m + ':' + (s < 10 ? '0' : '') + s;
      }

      // ---------- 控制 ----------
      function goTo(index) {
        if (index < 0) index = 0;
        if (index >= LYRICS.length) index = LYRICS.length - 1;
        current = index;
        render();
        resetTimer();
        if (isPlaying) startTimer();
      }

      function next() {
        goTo(current + 1 >= LYRICS.length ? 0 : current + 1);
      }

      function prev() {
        goTo(current - 1);
      }

      function reset() {
        goTo(0);
      }

      function togglePlay() {
        isPlaying = !isPlaying;
        playIcon.textContent = isPlaying ? '⏸' : '▶️';
        if (isPlaying) startTimer();
        else stopTimer();
      }

      function startTimer() {
        stopTimer();
        timer = setInterval(next, STEP);
        // 启动时立即更新一次进度（让进度条动起来）
        updateProgress();
      }

      function stopTimer() {
        if (timer) { clearInterval(timer); timer = null; }
      }

      function resetTimer() {
        stopTimer();
        if (isPlaying) startTimer();
      }

      // ---------- 事件绑定 ----------
      playBtn.addEventListener('click', togglePlay);
      nextBtn.addEventListener('click', () => { stopTimer(); next(); if (isPlaying) startTimer(); });
      prevBtn.addEventListener('click', () => { stopTimer(); prev(); if (isPlaying) startTimer(); });
      resetBtn.addEventListener('click', () => { stopTimer(); reset(); if (isPlaying) startTimer(); });

      progressBar.addEventListener('click', (e) => {
        const rect = progressBar.getBoundingClientRect();
        const pct = (e.clientX - rect.left) / rect.width;
        const idx = Math.floor(pct * LYRICS.length);
        const target = Math.min(Math.max(idx, 0), LYRICS.length - 1);
        stopTimer();
        goTo(target);
        if (isPlaying) startTimer();
      });

      // 键盘快捷键（可选）
      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
        if (e.code === 'ArrowRight') { e.preventDefault(); nextBtn.click(); }
        if (e.code === 'ArrowLeft') { e.preventDefault(); prevBtn.click(); }
      });

      // ---------- 初始化 ----------
      render();
      startTimer();

      // 窗口改变时重新调整滚动
      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(scrollToActive, 300);
      });

      console.log('🌤️ 晴天 · 周杰伦 — 歌词播放器已启动 (按空格暂停/继续)');
    })();
  </script>
