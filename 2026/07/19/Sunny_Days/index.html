        <script src="https://cdn.jsdelivr.net/npm/darkreader@4.9.80/darkreader.min.js"></script>
        <script>
            const drOptions = {
                brightness: 100,
                contrast: 95,
                sepia: 10,
                darkSchemeTextColor: '#e0e0e0',  // 粉笔白文字
                darkSchemeBackgroundColor: '#1e1e1e', // 黑板灰背景
                scrollbarStyle: 'native'
            };

            const savedTheme = localStorage.getItem('theme');
            const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
                DarkReader.enable(drOptions);
            }

            window.addEventListener('DOMContentLoaded', () => {
                const btn = document.createElement('button');
                btn.innerText = '🌓';
                // 按钮样式：仿照你之前的布局，放在右下角
                btn.style.cssText = `
                    position: fixed; 
                    bottom: 40px; 
                    left: 42px; 
                    z-index: 9999;
                    width: 44px; 
                    height: 44px; 
                    border-radius: 50%; 
                    border: 1px solid #ccc;
                    background: #f7f5ed; 
                    color: #000;
                    font-size: 22px; 
                    cursor: pointer;
                    box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
                    transition: transform 0.2s, background-color 0.3s;
                `;
                // 根据当前状态初始化按钮颜色
                if (DarkReader.isEnabled()) {
                    btn.style.backgroundColor = '#1e1e1e';
                    btn.style.color = '#fff';
                }
                btn.onmouseover = () => btn.style.transform = 'scale(1.1)';
                btn.onmouseout = () => btn.style.transform = 'scale(1)';
                document.body.appendChild(btn);
                // 点击切换逻辑
                btn.addEventListener('click', () => {
                    if (DarkReader.isEnabled()) {
                        DarkReader.disable();
                        localStorage.setItem('theme', 'light');
                        btn.style.backgroundColor = '#f7f5ed';
                        btn.style.color = '#000';
                    } else {
                        DarkReader.enable(drOptions);
                        localStorage.setItem('theme', 'dark');
                        btn.style.backgroundColor = '#1e1e1e';
                        btn.style.color = '#fff';
                    }
                });
            });
        </script>

    @keyframes cardIn {

            transform: translateY(40px) scale(0.96);
        }
        100% {
            opacity: 1;
            transform: translateY(0) scale(1);

    /* 加载中的小提示 */

        position: fixed;

        font-size: 12px;
        color: rgba(255, 255, 255, 0.08);
        letter-spacing: 2px;
        font-weight: 300;
        animation: fadeTip 4s ease-in-out infinite;
    }
    @keyframes fadeTip {
        0%,
        100% {
            opacity: 0.3;
        }
        50% {
            opacity: 0.8;

<pre><code>&lt;!-- ===== 背景光晕 ===== --&gt;

&lt;!-- ===== 主卡片 ===== --&gt;
&lt;div class=&quot;player-card&quot; id=&quot;playerCard&quot;&gt;

    &lt;!-- 顶部 --&gt;
    &lt;div class=&quot;song-header&quot;&gt;
        &lt;div class=&quot;song-info&quot;&gt;
            &lt;div class=&quot;song-title&quot;&gt;晴天&lt;/div&gt;

        &lt;/div&gt;
        &lt;div class=&quot;song-badge&quot;&gt;
            &lt;span class=&quot;dot&quot;&gt;&lt;/span&gt;
            &lt;span&gt;播放中&lt;/span&gt;

    &lt;/div&gt;

    &lt;!-- 歌词 --&gt;
    &lt;div class=&quot;lyrics-wrapper&quot;&gt;
        &lt;div class=&quot;lyrics-container&quot; id=&quot;lyricsContainer&quot;&gt;
            &lt;!-- JS 动态渲染 --&gt;
        &lt;/div&gt;
    &lt;/div&gt;

    &lt;!-- 底部 --&gt;
    &lt;div class=&quot;player-footer&quot;&gt;
        &lt;div class=&quot;progress-wrap&quot;&gt;
            &lt;div class=&quot;progress-bar&quot; id=&quot;progressBar&quot;&gt;
                &lt;div class=&quot;progress-fill&quot; id=&quot;progressFill&quot;&gt;&lt;/div&gt;
            &lt;/div&gt;
            &lt;span class=&quot;progress-time&quot; id=&quot;progressTime&quot;&gt;0:00&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;controls&quot;&gt;
            &lt;button class=&quot;ctrl-btn&quot; id=&quot;prevBtn&quot; title=&quot;上一句&quot;&gt;
                &lt;span&gt;⏮&lt;/span&gt;
            &lt;/button&gt;
            &lt;button class=&quot;ctrl-btn primary&quot; id=&quot;playBtn&quot; title=&quot;播放 / 暂停&quot;&gt;
                &lt;span id=&quot;playIcon&quot;&gt;⏸&lt;/span&gt;
            &lt;/button&gt;
            &lt;button class=&quot;ctrl-btn&quot; id=&quot;nextBtn&quot; title=&quot;下一句&quot;&gt;
                &lt;span&gt;⏭&lt;/span&gt;
            &lt;/button&gt;
            &lt;button class=&quot;ctrl-btn&quot; id=&quot;resetBtn&quot; title=&quot;重头开始&quot;&gt;
                &lt;span&gt;⟳&lt;/span&gt;
                &lt;span class=&quot;label&quot;&gt;重播&lt;/span&gt;
            &lt;/button&gt;
        &lt;/div&gt;
    &lt;/div&gt;
&lt;/div&gt;

&lt;!-- 底部小提示 --&gt;
&lt;div class=&quot;loading-tip&quot;&gt;✦ 点击卡片暂停 · 滚轮可浏览 ✦&lt;/div&gt;

&lt;script&gt;
    // ============================================================
    //  1. 歌词数据
    // ============================================================
    const LYRICS = [
        &#39;故事的小黄花 从出生那年就飘着&#39;,
        &#39;童年的荡秋千 随记忆一直晃到现在&#39;,
        &#39;Re So So Si Do Si La&#39;,
        &#39;So La Si Si Si Si La Si La So&#39;,
        &#39;吹着前奏望着天空 我想起花瓣试着掉落&#39;,
        &#39;为你翘课的那一天 花落的那一天&#39;,
        &#39;教室的那一间 我怎么看不见&#39;,
        &#39;消失的下雨天 我好想再淋一遍&#39;,
        &#39;没想到失去的勇气我还留着&#39;,
        &#39;好想再问一遍 你会等待还是离开&#39;,
        &#39;刮风这天我试过握着你手&#39;,
        &#39;但偏偏雨渐渐大到我看你不见&#39;,
        &#39;还要多久我才能在你身边&#39;,
        &#39;等到放晴的那天也许我会比较好一点&#39;,
        &#39;从前从前有个人爱你很久&#39;,
        &#39;但偏偏风渐渐把距离吹得好远&#39;,
        &#39;好不容易又能再多爱一天&#39;,
        &#39;但故事的最后你好像还是说了拜拜&#39;
    ];

    // ============================================================
    //  2. DOM 引用
    // ============================================================
    const container = document.getElementById(&#39;lyricsContainer&#39;);
    const progressFill = document.getElementById(&#39;progressFill&#39;);
    const progressTime = document.getElementById(&#39;progressTime&#39;);
    const playBtn = document.getElementById(&#39;playBtn&#39;);
    const playIcon = document.getElementById(&#39;playIcon&#39;);
    const prevBtn = document.getElementById(&#39;prevBtn&#39;);
    const nextBtn = document.getElementById(&#39;nextBtn&#39;);
    const resetBtn = document.getElementById(&#39;resetBtn&#39;);
    const progressBar = document.getElementById(&#39;progressBar&#39;);

    // ============================================================
    //  3. 状态
    // ============================================================
    let currentIndex = 0;
    let isPlaying = true;
    let intervalId = null;
    const INTERVAL_MS = 3200; // 每句显示 3.2 秒
    let elapsedMs = 0;
    let startTime = 0;
    let animFrameId = null;

    // ============================================================
    //  4. 渲染歌词
    // ============================================================
    function renderLyrics() {
        container.innerHTML = &#39;&#39;;
        LYRICS.forEach((text, idx) =&gt; {
            const div = document.createElement(&#39;div&#39;);
            div.className = &#39;lyric-line&#39;;
            if (idx === currentIndex) div.classList.add(&#39;active&#39;);
            else if (idx &lt; currentIndex) div.classList.add(&#39;done&#39;);
            else div.classList.add(&#39;upcoming&#39;);
            div.textContent = text;
            div.dataset.index = idx;
            container.appendChild(div);
        });
        // 滚动到当前行
        scrollToActive();
    }

    function scrollToActive() {
        const active = container.querySelector(&#39;.lyric-line.active&#39;);
        if (active) {
            const containerHeight = container.clientHeight;
            const activeTop = active.offsetTop;
            const activeHeight = active.offsetHeight;
            const targetScroll = activeTop - (containerHeight / 2) + (activeHeight / 2);
            container.scrollTo({
                top: Math.max(0, targetScroll),
                behavior: &#39;smooth&#39;
            });
        }
    }

    // ============================================================
    //  5. 更新高亮
    // ============================================================
    function updateHighlight(index) {
        const lines = container.querySelectorAll(&#39;.lyric-line&#39;);
        lines.forEach((line, idx) =&gt; {
            line.classList.remove(&#39;active&#39;, &#39;done&#39;, &#39;upcoming&#39;);
            if (idx === index) {
                line.classList.add(&#39;active&#39;);
            } else if (idx &lt; index) {
                line.classList.add(&#39;done&#39;);
            } else {
                line.classList.add(&#39;upcoming&#39;);
            }
        });
        scrollToActive();
        updateProgress();
    }

    // ============================================================
    //  6. 进度
    // ============================================================
    function updateProgress() {
        const total = LYRICS.length;
        const pct = total &gt; 0 ? (currentIndex / (total - 1)) * 100 : 0;
        progressFill.style.width = Math.min(pct, 100) + &#39;%&#39;;
        // 时间显示 (模拟)
        const totalSeconds = (total - 1) * (INTERVAL_MS / 1000);
        const currentSeconds = currentIndex * (INTERVAL_MS / 1000);
        progressTime.textContent = formatTime(currentSeconds) + &#39; / &#39; + formatTime(totalSeconds);
    }

    function formatTime(seconds) {
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return m + &#39;:&#39; + (s &lt; 10 ? &#39;0&#39; : &#39;&#39;) + s;
    }

    // ============================================================
    //  7. 核心控制
    // ============================================================
    function goTo(index) {
        if (index &lt; 0) index = 0;
        if (index &gt;= LYRICS.length) index = LYRICS.length - 1;
        currentIndex = index;
        updateHighlight(currentIndex);
        // 重置计时器
        resetTimer();
        if (isPlaying) startTimer();
    }

    function next() {
        if (currentIndex &lt; LYRICS.length - 1) {
            goTo(currentIndex + 1);
        } else {
            // 循环到开头
            goTo(0);
        }
    }

    function prev() {
        if (currentIndex &gt; 0) {
            goTo(currentIndex - 1);
        }
    }

    function reset() {
        goTo(0);
        progressFill.style.width = &#39;0%&#39;;
        progressTime.textContent = &#39;0:00 / &#39; + formatTime((LYRICS.length - 1) * (INTERVAL_MS / 1000));
    }

    // ============================================================
    //  8. 定时器
    // ============================================================
    function startTimer() {
        stopTimer();
        intervalId = setInterval(() =&gt; {
            if (isPlaying) {
                next();
            }
        }, INTERVAL_MS);
        // 也用 rAF 更新进度条动画 (平滑)
        startTime = performance.now();
        elapsedMs = 0;
        if (animFrameId) cancelAnimationFrame(animFrameId);
        animateProgress();
    }

    function stopTimer() {
        if (intervalId) {
            clearInterval(intervalId);
            intervalId = null;
        }
        if (animFrameId) {
            cancelAnimationFrame(animFrameId);
            animFrameId = null;
        }
    }

    function resetTimer() {
        stopTimer();
        if (isPlaying) startTimer();
    }

    function animateProgress() {
        if (!isPlaying) {
            animFrameId = null;
            return;
        }
        const now = performance.now();
        const delta = now - startTime;
        const pctPerStep = 100 / (LYRICS.length - 1);
        const stepProgress = Math.min(delta / INTERVAL_MS, 1);
        const basePct = currentIndex * pctPerStep;
        const currentPct = Math.min(basePct + stepProgress * pctPerStep, 100);
        progressFill.style.width = currentPct + &#39;%&#39;;

        // 更新时间显示
        const totalSeconds = (LYRICS.length - 1) * (INTERVAL_MS / 1000);
        const currentSeconds = Math.min(currentIndex * (INTERVAL_MS / 1000) + delta / 1000, totalSeconds);
        progressTime.textContent = formatTime(currentSeconds) + &#39; / &#39; + formatTime(totalSeconds);

        animFrameId = requestAnimationFrame(animateProgress);
    }

    // ============================================================
    //  9. 播放 / 暂停
    // ============================================================
    function togglePlay() {
        isPlaying = !isPlaying;
        playIcon.textContent = isPlaying ? &#39;⏸&#39; : &#39;▶️&#39;;
        if (isPlaying) {
            startTimer();
        } else {
            stopTimer();
            // 暂停时进度条停在当前位置
        }
    }

    // ============================================================
    //  10. 星空粒子 (Canvas)
    // ============================================================
    function initStars() {
        const canvas = document.getElementById(&#39;stars-canvas&#39;);
        const ctx = canvas.getContext(&#39;2d&#39;);
        let w, h;
        const stars = [];
        const COUNT = 180;

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.addEventListener(&#39;resize&#39;, resize);
        resize();

        for (let i = 0; i &lt; COUNT; i++) {
            stars.push({
                x: Math.random() * w,
                y: Math.random() * h,
                r: Math.random() * 1.8 + 0.4,
                dx: (Math.random() - 0.5) * 0.25,
                dy: (Math.random() - 0.5) * 0.25,
                opacity: Math.random() * 0.6 + 0.2,
                twinkleSpeed: Math.random() * 0.02 + 0.005,
                phase: Math.random() * Math.PI * 2
            });
        }

        function draw() {
            ctx.clearRect(0, 0, w, h);
            const time = Date.now() * 0.001;

            stars.forEach(s =&gt; {
                // 移动
                s.x += s.dx;
                s.y += s.dy;
                if (s.x &lt; 0) s.x = w;
                if (s.x &gt; w) s.x = 0;
                if (s.y &lt; 0) s.y = h;
                if (s.y &gt; h) s.y = 0;

                // 闪烁
                const twinkle = Math.sin(time * s.twinkleSpeed + s.phase) * 0.3 + 0.7;
                const alpha = s.opacity * twinkle;

                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
                ctx.fill();

                // 偶尔加一点光晕
                if (s.r &gt; 1.4) {
                    ctx.shadowColor = &#39;rgba(255, 255, 255, 0.08)&#39;;
                    ctx.shadowBlur = 12;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r * 0.5, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.15})`;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            });

            requestAnimationFrame(draw);
        }
        draw();

        // 窗口变化时重置星星位置比例
        window.addEventListener(&#39;resize&#39;, () =&gt; {
            resize();
            stars.forEach(s =&gt; {
                s.x = Math.random() * w;
                s.y = Math.random() * h;
            });
        });
    }

    // ============================================================
    //  11. 事件绑定 &amp; 初始化
    // ============================================================
    playBtn.addEventListener(&#39;click&#39;, togglePlay);

    nextBtn.addEventListener(&#39;click&#39;, () =&gt; {
        if (isPlaying) {
            // 手动点击下一句，重置计时器
            stopTimer();
            next();
            if (isPlaying) startTimer();
        } else {
            next();
        }
    });

    prevBtn.addEventListener(&#39;click&#39;, () =&gt; {
        if (isPlaying) {
            stopTimer();
            prev();
            if (isPlaying) startTimer();
        } else {
            prev();
        }
    });

    resetBtn.addEventListener(&#39;click&#39;, () =&gt; {
        if (isPlaying) {
            stopTimer();
            reset();
            if (isPlaying) startTimer();
        } else {
            reset();
        }
    });

    // 点击进度条跳转 (近似)
    progressBar.addEventListener(&#39;click&#39;, (e) =&gt; {
        const rect = progressBar.getBoundingClientRect();
        const pct = (e.clientX - rect.left) / rect.width;
        const idx = Math.floor(pct * LYRICS.length);
        const target = Math.min(Math.max(idx, 0), LYRICS.length - 1);
        if (isPlaying) {
            stopTimer();
            goTo(target);
            if (isPlaying) startTimer();
        } else {
            goTo(target);
        }
    });

    // 键盘快捷键 (空格切换)
    document.addEventListener(&#39;keydown&#39;, (e) =&gt; {
        if (e.target.tagName === &#39;INPUT&#39; || e.target.tagName === &#39;TEXTAREA&#39;) return;
        if (e.code === &#39;Space&#39;) {
            e.preventDefault();
            togglePlay();
        }
        if (e.code === &#39;ArrowRight&#39;) {
            e.preventDefault();
            nextBtn.click();
        }
        if (e.code === &#39;ArrowLeft&#39;) {
            e.preventDefault();
            prevBtn.click();
        }
    });

    // 点击卡片暂停/继续 (方便操作)
    document.getElementById(&#39;playerCard&#39;).addEventListener(&#39;click&#39;, (e) =&gt; {
        // 排除按钮点击
        if (e.target.closest(&#39;button&#39;) || e.target.closest(&#39;.progress-bar&#39;)) return;
        togglePlay();
    });

    // ============================================================
    //  12. 启动！
    // ============================================================
    renderLyrics();
    updateProgress();
    initStars();

    // 延迟一点开始播放，让入场动画先走
    setTimeout(() =&gt; {
        if (isPlaying) startTimer();
    }, 500);

    // 窗口变化时调整滚动
    window.addEventListener(&#39;resize&#39;, () =&gt; {
        setTimeout(scrollToActive, 200);
    });

    // 监听滚动，如果用户手动滚动，不要干扰自动滚动 (但自动滚动会接管)
    // 但是我们不会阻止用户滚动，只是自动滚动会定期调整

    console.log(&#39;🎵 晴天 · 周杰伦  —  歌词展示已启动&#39;);
    console.log(&#39;✨ 按 空格键 暂停/继续  |  ← → 切换歌词&#39;);
&lt;/script&gt;
